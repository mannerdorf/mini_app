# Timeweb App Platform → Docker Compose (staging deploy).
# Первый сервис получает домен; nginx в контейнере проксирует /api → VPS :80.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ""
    # Timeweb: хост-порты 80/443 зарезервированы; первый сервис — 8080→80 (см. docs App Platform).
    ports:
      - "8080:80"
    restart: unless-stopped
