# Статика miniapp (Vite SPA) + same-origin proxy /api → VPS.
# Браузер может ходить на https://haulz.space/api/* — proxy на api.haulz.space.

# Only known public GET/HEAD routes on the two aliases are consolidated.
# Unknown query keys can belong to account, payment or integration deep links.
map $args $public_base_query {
    default 0;
    "" 1;
    ~^((utm_(source|medium|campaign|term|content)|yclid|gclid|direction|_ym_debug)=[^&]*&?)+$ 1;
}
# Pagination is public only on the blog index.
map "$uri:$args" $public_query {
    default $public_base_query;
    ~^/blog/?:page=[1-9][0-9]*$ 1;
}
map $uri $public_page {
    default 0;
    / 1;
    /index.html 1;
    ~^/(kalkulyator|faq|sklady|o-kompanii|about|app|blog|perevozka-moskva-kaliningrad|perevozka-kaliningrad-moskva)/?$ 1;
    ~^/blog/[a-zA-Z0-9][a-zA-Z0-9_-]*/?$ 1;
    ~^/uslugi/[a-z0-9][a-z0-9-]*/?$ 1;
}
map "$host:$public_page:$public_query:$request_method" $redirect_public_alias {
    default 0;
    ~^(haulz\.ru|haulz\.pro|www\.haulz\.ru):1:1:(GET|HEAD)$ 1;
}

# Normalize only public navigation; account/integration query strings stay intact.
map $uri $normalized_public_path {
    default "";
    /index.html /;
    /about /o-kompanii;
    /about/ /o-kompanii;
    ~^/uslugi/(?<public_service_without_slash>[a-z0-9][a-z0-9-]*)/$ /uslugi/$public_service_without_slash;
    ~^/(?<public_path_without_slash>kalkulyator|faq|sklady|o-kompanii|app|blog|perevozka-moskva-kaliningrad|perevozka-kaliningrad-moskva)/$ /$public_path_without_slash;
    ~^/blog/(?<public_article_without_slash>[a-zA-Z0-9][a-zA-Z0-9_-]*)/$ /blog/$public_article_without_slash;
}
map $normalized_public_path $public_target_path {
    "" $uri;
    default $normalized_public_path;
}
map "$public_query:$request_method:$normalized_public_path" $redirect_normalized_public {
    default 0;
    ~^1:(GET|HEAD):/ 1;
}
map $public_query $public_home_document {
    0 /index.html;
    1 /seo-shells/home.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 25m;

    if ($redirect_public_alias) {
        return 301 https://haulz.space$public_target_path$is_args$args;
    }

    if ($redirect_normalized_public) {
        return 301 https://haulz.space$public_target_path$is_args$args;
    }

    # Route landings use the same slashless URL as canonical and sitemap.
    location = /perevozka-moskva-kaliningrad/ {
        return 301 https://haulz.space/perevozka-moskva-kaliningrad$is_args$args;
    }
    location = /perevozka-kaliningrad-moskva/ {
        return 301 https://haulz.space/perevozka-kaliningrad-moskva$is_args$args;
    }
    location = /perevozka-moskva-kaliningrad {
        try_files /perevozka-moskva-kaliningrad/index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /perevozka-kaliningrad-moskva {
        try_files /perevozka-kaliningrad-moskva/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # API на VPS по HTTP :80 (там стабильно; :443 с части сетей зависает).
    location /api/ {
        proxy_pass http://72.56.36.185;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.haulz.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering on;
    }

    location = /health {
        proxy_pass http://72.56.36.185/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Hashed assets — 404, не SPA HTML (иначе chunk reload loop).
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Only registered application routes may use the SPA shell.
    location ~* ^/(admin|cms|wildberries|red-returns)/?$ {
        try_files /index.html =404;
    }
    location = /blog {
        proxy_pass http://72.56.36.185/api/public-editor-index;
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_intercept_errors on;
        error_page 404 /404.html;
    }
    location ~ ^/(?<public_shell>kalkulyator|faq|sklady|o-kompanii|app)/?$ {
        try_files /seo-shells/$public_shell.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(about|login|forgot)/?$ {
        try_files /index.html =404;
    }
    location ^~ /seo-shells/ {
        internal;
    }
    location ~* "^/blog/(?<article_slug>[a-z0-9][a-z0-9_-]{0,120})/?$" {
        proxy_pass http://72.56.36.185/api/public-editor-article?slug=$article_slug;
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_intercept_errors on;
        error_page 404 /404.html;
    }
    location ~ "^/uslugi/(?<service_slug>[a-z0-9][a-z0-9-]{0,120})/?$" {
        proxy_pass http://72.56.36.185/api/public-service-page?slug=$service_slug;
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_intercept_errors on;
        error_page 404 /404.html;
    }
    location = /api/public-blog {
        proxy_pass http://72.56.36.185/api/public-editor-blog;
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location = /api/sitemap {
        proxy_pass http://72.56.36.185/api/public-editor-sitemap;
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location = /sitemap.xml {
        proxy_pass http://72.56.36.185/api/public-editor-sitemap;
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location = /public-analytics.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = / {
        try_files $public_home_document =404;
    }
    # Scoped to unknown documents: missing JS/assets retain plain 404 responses.
    location / {
        error_page 404 /404.html;
        try_files $uri $uri/ =404;
    }
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }
}
