# Статика miniapp (Vite SPA) + same-origin proxy /api → VPS.
# Браузер может ходить на https://haulz.space/api/* — proxy на api.haulz.space.

# Only known public GET/HEAD routes on the two aliases are consolidated.
# Unknown query keys can belong to account, payment or integration deep links.
map $args $public_query {
    default 0;
    "" 1;
    ~^((utm_(source|medium|campaign|term|content)|yclid|gclid|direction|_ym_debug)=[^&]*&?)+$ 1;
}
map $uri $public_page {
    default 0;
    / 1;
    ~^/(kalkulyator|faq|sklady|o-kompanii|about|app|blog|perevozka-moskva-kaliningrad|perevozka-kaliningrad-moskva)/?$ 1;
    ~^/blog/[a-zA-Z0-9][a-zA-Z0-9_-]*/?$ 1;
}
map "$host:$public_page:$public_query:$request_method" $redirect_public_alias {
    default 0;
    ~^(haulz\.ru|haulz\.pro):1:1:(GET|HEAD)$ 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 25m;

    if ($redirect_public_alias) {
        return 301 https://haulz.space$request_uri;
    }

    # API на VPS по HTTP :80 (там стабильно; :443 с части сетей зависает).
    location /api/ {
        proxy_pass http://72.56.36.185;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.haulz.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering on;
    }

    location = /health {
        proxy_pass http://72.56.36.185/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.haulz.space;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Hashed assets — 404, не SPA HTML (иначе chunk reload loop).
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
