# HAULZ: nginx для api.haulz.space (Timeweb VPS).
#
# Установка:
#   sudo cp deploy/nginx-api.haulz.space.conf /etc/nginx/sites-available/api.haulz.space
#   sudo ln -sf /etc/nginx/sites-available/api.haulz.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: A api.haulz.space → IP VPS
# Проверка до DNS:
#   curl -sS -D- "http://YOUR_VPS_IP/api/auth-config" -H "Host: api.haulz.space"
#
# SSL:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.haulz.space

server {
    listen 80;
    listen [::]:80;
    server_name api.haulz.space;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
