# HAULZ API — nginx для api.haulz.space (Timeweb VPS 72.56.36.185).
#
# Критично:
# 1) :80 ПРОДОЛЖАЕТ проксировать /api/ (не 301 → https), иначе haulz.space → VPS мёртв.
# 2) http2 на :443 выключен — иначе TLS hang с части сетей / iOS.
#
# Установка: bash /opt/haulz/app/deploy/apply-nginx-api-space.sh

upstream haulz_api_space {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.haulz.space;

    client_max_body_size 50m;
    client_body_timeout 300s;
    send_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location ^~ /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 403;
    }
    location = /api/notification-poll {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 403;
    }
    location = /api/notification-daily-summary {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 403;
    }

    location /api/ {
        proxy_pass http://haulz_api_space;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
    }

    location = /health {
        proxy_pass http://haulz_api_space;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.haulz.space;

    ssl_certificate /etc/letsencrypt/live/api.haulz.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.haulz.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    client_body_timeout 300s;
    send_timeout 300s;
    keepalive_timeout 65s;

    location ^~ /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 403;
    }
    location = /api/notification-poll {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 403;
    }
    location = /api/notification-daily-summary {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 403;
    }

    location /api/ {
        proxy_pass http://haulz_api_space;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
    }

    location = /health {
        proxy_pass http://haulz_api_space;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
