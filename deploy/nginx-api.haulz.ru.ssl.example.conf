# HAULZ API — nginx после certbot.
# Важно: :80 должен ПРОДОЛЖАТЬ проксировать /api/, а не только 301 → https.
# Иначе при зависании TLS на :443 клиенты полностью теряют API (Failed to fetch).

upstream haulz_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP: API + ACME; редирект только для не-/api
server {
    listen 80;
    listen [::]:80;
    server_name api.haulz.ru;

    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://haulz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — пути к сертификатам подставит certbot / ваши пути.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.haulz.ru;

    # ssl_certificate /etc/letsencrypt/live/api.haulz.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.haulz.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://haulz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
