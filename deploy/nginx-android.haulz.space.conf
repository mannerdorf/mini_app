# Статический репозиторий Android APK: android.haulz.space
# Отдельный Timeweb VPS / VM (не обязательно тот же, что api.haulz.space).
#
# DNS: A android.haulz.space → IP этого сервера
#
# Установка:
#   sudo mkdir -p /var/www/android.haulz.space/releases
#   sudo cp deploy/nginx-android.haulz.space.conf /etc/nginx/sites-available/android.haulz.space
#   sudo ln -sf /etc/nginx/sites-available/android.haulz.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d android.haulz.space
#
# Деплой APK из репозитория:
#   ANDROID_RELEASE_SSH=root@YOUR_SERVER \
#   ./scripts/deploy-android-release.sh dist/haulz-miniapp-release.apk

server {
    listen 80;
    listen [::]:80;
    server_name android.haulz.space;

    root /var/www/android.haulz.space;
    index index.html;
    charset utf-8;

    client_max_body_size 50m;

    # Манифест обновлений для приложения
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Постоянная ссылка на последний APK
    location = /latest.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="haulz-miniapp-latest.apk"';
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /releases/ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
