apiVersion: v1
kind: ConfigMap
metadata:
  name: ess-chat-well-known
  namespace: ess
  labels:
    app.kubernetes.io/part-of: matrix-stack
data:
  client: |
    {
      "m.homeserver": {
        "base_url": "https://matrix.chat.haulz.space"
      }
    }
  server: |
    {
      "m.server": "matrix.chat.haulz.space:443"
    }
