# HAULZ API — nginx для api.haulz.ru (HTTP + HTTPS).
#
# Критично:
# 1) :80 ПРОДОЛЖАЕТ проксировать /api/ (не только 301 → https), иначе при зависании TLS всё мертво.
# 2) http2 выключен — на этом хосте наблюдались TLS hang после ClientHello при http2.
#
# Установка: bash deploy/apply-nginx-api.sh

upstream haulz_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Общий proxy для /api/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name api.haulz.ru;

    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 60s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /api/ {
        proxy_pass http://haulz_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location = /health {
        proxy_pass http://haulz_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.haulz.ru;

    # Подставляется apply-nginx-api.sh (certbot live paths).
    include /etc/nginx/snippets/haulz-api-ssl-certs.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HaulzSSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://haulz_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location = /health {
        proxy_pass http://haulz_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
