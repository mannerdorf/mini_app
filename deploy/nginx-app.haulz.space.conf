# Статический репозиторий Android APK: app.haulz.space
# Отдельный Timeweb VPS (200.165.236.49).
#
# DNS: A app.haulz.space → IP этого сервера
#
# Установка:
#   sudo mkdir -p /var/www/app.haulz.space/releases
#   sudo cp deploy/nginx-app.haulz.space.conf /etc/nginx/sites-available/app.haulz.space
#   sudo ln -sf /etc/nginx/sites-available/app.haulz.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.haulz.space

server {
    listen 80;
    listen [::]:80;
    server_name app.haulz.space;

    root /var/www/app.haulz.space;
    index index.html;
    charset utf-8;

    client_max_body_size 50m;

    location = /version.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /latest.apk {
        default_type application/vnd.android.package-archive;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        add_header Content-Disposition 'attachment; filename="haulz-miniapp-latest.apk"';
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /releases/ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
