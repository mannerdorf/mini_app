<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="yandex" content="noindex, nofollow" />
    <!-- Telegram / MAX SDK подключаются только в контексте мини-приложения (см. __haulzWebAppSdkReady) — в обычном браузере нет запросов к telegram.org / st.max.ru -->
    <script>
      (function () {
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        var ua = navigator.userAgent || "";
        var forceAll = /(?:^|[?&])haulzWebAppSdks=all(?:&|$)/.test(search);

        function needsTelegram() {
          if (forceAll) return true;
          if (/Telegram/i.test(ua)) return true;
          if (/tgWebAppData=/i.test(search) || /tgWebAppData=/i.test(hash)) return true;
          return false;
        }
        function needsMax() {
          if (forceAll) return true;
          if (/max[^a-z0-9]?app/i.test(ua)) return true;
          if (/WebAppData=/i.test(hash)) return true;
          return false;
        }
        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            s.onload = function () {
              resolve();
            };
            s.onerror = function () {
              reject(new Error("Failed to load " + src));
            };
            document.head.appendChild(s);
          });
        }
        var chain = Promise.resolve();
        if (needsTelegram()) {
          chain = chain
            .then(function () {
              return loadScript("https://telegram.org/js/telegram-web-app.js");
            })
            .catch(function (e) {
              console.warn("[HAULZ] telegram-web-app.js:", e && e.message ? e.message : e);
            });
        }
        if (needsMax()) {
          chain = chain
            .then(function () {
              return loadScript("https://st.max.ru/js/max-web-app.js");
            })
            .catch(function (e) {
              console.warn("[HAULZ] max-web-app.js:", e && e.message ? e.message : e);
            });
        }
        window.__haulzWebAppSdkReady = chain;
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3655ff" />
    <title>HAULZ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Bitrix: только в обычном браузере (в TG/MAX CDN часто недоступен → ERR_CONNECTION_CLOSED) -->
    <script>
      (function (w, d, u) {
        var search = w.location.search || "";
        var hash = w.location.hash || "";
        var ua = navigator.userAgent || "";
        function isMiniAppHost() {
          if (/Telegram/i.test(ua)) return true;
          if (/tgWebAppData=/i.test(search) || /tgWebAppData=/i.test(hash)) return true;
          if (/max[^a-z0-9]?app/i.test(ua)) return true;
          if (/WebAppData=/i.test(hash)) return true;
          return false;
        }
        function isEmbeddedAppShell() {
          if (isMiniAppHost()) return true;
          try {
            if (w.Capacitor && typeof w.Capacitor.isNativePlatform === "function" && w.Capacitor.isNativePlatform()) {
              return true;
            }
          } catch (e) {}
          var protocol = String(w.location.protocol || "").toLowerCase();
          if (protocol === "capacitor:" || protocol === "ionic:") return true;
          return false;
        }
        function inject() {
          if (isEmbeddedAppShell()) return;
          var s = d.createElement("script");
          s.async = true;
          s.src = u + "?" + ((Date.now() / 60000) | 0);
          s.onerror = function () {
            console.warn("[HAULZ] Bitrix site button loader недоступен");
          };
          var h = d.getElementsByTagName("script")[0];
          h.parentNode.insertBefore(s, h);
        }
        if (w.document.readyState === "complete") inject();
        else w.addEventListener("load", inject, { once: true });
      })(window, document, "https://cdn-ru.bitrix24.ru/b33102400/crm/site_button/loader_1_q2c97k.js");
    </script>
  </body>
</html>
